[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rin-launcher"
dynamic = ["version"]
description = "类似希沃桌面助手的启动台应用 - 基于 Python + RinUI (QML)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "PyYAML>=6.0.1",
    "darkdetect~=0.8.0",
    "pynput>=1.7.6",
    "watchdog>=3.0.0",
    # 启动台搜索的拼音全拼 / 首字母匹配；缺了会自动退化为普通子串。
    "pypinyin>=0.51.0",
    "pywin32; sys_platform == 'win32'",
    # 小窗底部的系统控制（音量 / Wi-Fi / 移动热点）。
    "pycaw>=20240215; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Networking.Connectivity>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Networking.NetworkOperators>=3.2.1; sys_platform == 'win32'",
    # Windows 原生 Toast（通知渠道里的「Windows 通知」）。
    "winrt-Windows.Data.Xml.Dom>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=3.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.1.0"]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]

[project.gui-scripts]
rin-launcher = "rin_launcher.main:main"

[tool.setuptools.packages.find]
include = ["rin_launcher*"]

# 版本号只有一处来源：rin_launcher/__init__.py 的 __version__（main.py 与
# config_manager 也引它，构建元数据这里动态读回来）。
[tool.setuptools.dynamic]
version = { attr = "rin_launcher.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

# 显式钉规则集：不跟随某个 ruff 版本的默认值漂移（新版本默认集扩过好几轮）。
# E4/E7/E9/F = 经典默认；W = 空白类告警；I = import 排序。
# 有意不启用 BLE/S：这个项目里「GUI 壳层吞掉一切异常并记日志」是有意为之。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 只接受严格的 v主版本.次版本.修订号 与可选的预发布后缀；玩笑 tag
      # （v1.1.114514 / v.1.1.2）必须在构建前就被拦住。
      - name: Validate tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Error "Invalid release tag: $tag"
            exit 1
          }
          Write-Host "Release tag OK: $tag"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt pytest ruff

      - name: Install UPX
        run: choco install upx -y --no-progress

      # 发布前先过同一套门禁：tag 推送也不能绕过测试。
      - name: Ruff
        run: ruff check rin_launcher tests scripts --no-cache

      - name: Pytest
        run: pytest tests -q

      - name: QML lint
        run: python scripts/lint_qml.py

      - name: Build (Nuitka standalone + UPX)
        run: python scripts/build_nuitka.py --upx

      # 冻结包冒烟：源码测试绿不代表 exe 能起来。恢复窗口只加载一个 QML，
      # 7 秒足够确认进程没在启动阶段崩掉。
      - name: Smoke test frozen package
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist/RinLauncher/RinLauncher.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }

          # Nuitka standalone 的 sys.executable 来自启动时的 argv[0]；如果构建
          # 机 / 启动副本把它写成 python.exe，自启动和重启都会指向不存在的文件。
          # 这里用隐藏入口把运行期路径落成 JSON，直接验收归一步骤。
          $infoPath = Join-Path (Get-Location) "runtime-info.json"
          $proc = Start-Process -FilePath $exe -ArgumentList "--runtime-info=$infoPath" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "runtime-info exited $($proc.ExitCode)" }
          if (-not (Test-Path $infoPath)) { throw "runtime-info was not written" }
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          if ($info.frozen -ne "True") { throw "runtime-info says frozen=$($info.frozen)" }
          if ([IO.Path]::GetFileName($info.launchTarget) -ne "RinLauncher.exe") {
            throw "launchTarget is not RinLauncher.exe: $($info.launchTarget)"
          }
          if (-not (Test-Path $info.launchTarget)) {
            throw "launchTarget does not exist: $($info.launchTarget)"
          }
          if ([IO.Path]::GetFileName($info.executable) -ne "RinLauncher.exe") {
            throw "sys.executable was not normalized: $($info.executable)"
          }
          Remove-Item $infoPath -Force
          Write-Host "Frozen runtime paths OK: $($info.executable)"

          # 复现用户现场：把 exe 复制成 python.exe 启动。Nuitka 会把
          # sys.executable 设成这个副本名；归一逻辑必须把自启动 / 重启指回
          # 安装目录的 RinLauncher.exe。
          $renamed = Join-Path (Split-Path $exe) "python.exe"
          Copy-Item $exe $renamed -Force
          $renamedInfo = Join-Path (Get-Location) "runtime-info-renamed.json"
          $renamedProc = Start-Process -FilePath $renamed `
            -ArgumentList "--runtime-info=$renamedInfo" -Wait -PassThru
          if ($renamedProc.ExitCode -ne 0) {
            throw "renamed runtime-info exited $($renamedProc.ExitCode)"
          }
          $renamedData = Get-Content $renamedInfo -Raw | ConvertFrom-Json
          if ([IO.Path]::GetFileName($renamedData.executable) -ne "RinLauncher.exe") {
            throw "renamed launch was not normalized: $($renamedData.executable)"
          }
          if ([IO.Path]::GetFileName($renamedData.launchTarget) -ne "RinLauncher.exe") {
            throw "renamed launchTarget: $($renamedData.launchTarget)"
          }
          if ([IO.Path]::GetFileName($renamedData.processImage) -ne "python.exe") {
            throw "renamed processImage: $($renamedData.processImage)"
          }
          Remove-Item $renamed,$renamedInfo -Force
          Write-Host "Renamed launch normalized OK: $($renamedData.executable)"

          $proc = Start-Process -FilePath $exe -ArgumentList "--recovery" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "frozen exe exited during recovery smoke test" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Frozen recovery smoke test OK"

          # 正常模式也要能把小窗、托盘、热键这条完整启动链跑起来；
          # 再用 --quit 验证单实例退出命令（安装 / 升级前的入口）。
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "frozen exe exited during normal smoke test" }
          & $exe --quit
          if (-not $proc.WaitForExit(5000)) {
            Stop-Process -Id $proc.Id -Force
            throw "frozen exe ignored --quit"
          }
          Write-Host "Frozen normal smoke test OK (--quit)"

      # 冒烟启动会在 dist 里生成 data/ 与 appmodset.conf：发布包不能带这两样，
      # 否则覆盖安装会用 first-run==true 的模板盖掉用户已有的启动配置。
      - name: Clean runtime files
        shell: pwsh
        run: |
          Remove-Item dist/RinLauncher/data -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist/RinLauncher/appmodset.conf -Force -ErrorAction SilentlyContinue
          Remove-Item dist/RinLauncher/updates -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist/RinLauncher/backup-* -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path dist/RinLauncher/data) { throw "runtime data still in payload" }
          if (Test-Path dist/RinLauncher/appmodset.conf) { throw "appmodset.conf still in payload" }
          Copy-Item scripts/repair.ps1 dist/RinLauncher/repair.ps1 -Force
          Write-Host "Runtime files cleaned"

      - name: Build install manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          python scripts/build_manifest.py dist/RinLauncher --version $version
          python scripts/build_manifest.py dist/RinLauncher --check
          if (-not (Test-Path dist/RinLauncher/install-manifest.json)) { throw "manifest missing" }
          if (-not (Test-Path dist/RinLauncher/repair.ps1)) { throw "repair.ps1 missing" }

      - name: Upgrade dry-run (cover install)
        shell: pwsh
        run: |
          # 用真实 zip 走一遍 1.1.9 的覆盖式安装脚本：解压 → 定位 exe →
          # 删除 payload 的 data/ → Copy-Item -Force → 校验大小。
          Compress-Archive -Path dist/RinLauncher/* -DestinationPath smoke-payload.zip
          $root = Join-Path $env:RUNNER_TEMP "rin-upgrade-smoke"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root "data") | Out-Null
          Set-Content -Path (Join-Path $root "data/user-marker.txt") -Value "keep-me" -Encoding utf8
          # 旧版本留下的启动配置：升级必须原样保留（否则每次更新都会重走 OOBE）。
          Set-Content -Path (Join-Path $root "appmodset.conf") -Value "first-run==false" -Encoding utf8
          Expand-Archive -Path smoke-payload.zip -DestinationPath (Join-Path $root "payload")
          $sourceExe = Get-ChildItem (Join-Path $root "payload") -Recurse -Filter RinLauncher.exe |
            Select-Object -First 1
          if (-not $sourceExe) { throw "payload has no RinLauncher.exe" }
          Copy-Item (Join-Path $sourceExe.DirectoryName "*") $root -Recurse -Force
          if (-not (Test-Path (Join-Path $root "RinLauncher.exe"))) { throw "install did not produce exe" }
          if (-not (Test-Path (Join-Path $root "data/user-marker.txt"))) { throw "install wiped user data" }
          $conf = Get-Content (Join-Path $root "appmodset.conf") -Raw
          if ($conf -notmatch "first-run==false") { throw "upgrade overwrote appmodset.conf" }
          Write-Host "Upgrade dry-run OK"

      - name: Package (zip)
        run: python scripts/build_zip.py dist/RinLauncher RinLauncher.zip

      - name: Verify zip size gate
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item RinLauncher.zip).Length / 1MB, 2)
          Write-Host "RinLauncher.zip: $mb MB"
          if ($mb -gt 55) { throw "RinLauncher.zip exceeds the 55 MB gate" }

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^##\s+" + [regex]::Escape($version) + "\b.*?(?=^##\s|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $body = $match.Value.Trim() +
              "`n`n[完整更新日志](https://github.com/yixuan0826/RinLauncher/blob/main/CHANGELOG.md)"
          } else {
            $body = "Rin Launcher $version"
          }
          $body | Set-Content release-notes.md -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: RinLauncher.zip
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (onedir)
        run: pyinstaller build.spec

      - name: Mark build channel
        shell: pwsh
        run: |
          $channel = if ("${{ github.ref_name }}" -match '-') { "Pre-Release" } else { "Release" }
          Set-Content -Path dist/RinLauncher/channel.txt -Value $channel -Encoding utf8

      - name: Package (zip)
        run: Compress-Archive -Path dist/RinLauncher/* -DestinationPath RinLauncher.zip

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^##\s+" + [regex]::Escape($version) + "\b.*?(?=^##\s|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $body = $match.Value.Trim() +
              "`n`n[完整更新日志](https://github.com/yixuan0826/RinLauncher/blob/main/CHANGELOG.md)"
          } else {
            $body = "Rin Launcher $version"
          }
          $body | Set-Content release-notes.md -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: RinLauncher.zip
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

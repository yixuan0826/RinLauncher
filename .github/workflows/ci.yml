name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check rin_launcher tests scripts

      - name: Pytest
        run: pytest tests -q

      # QML 有八千多行且没有自动化 UI 测试，lint 必须在 PR 阶段就拦下来，
      # 不能等到打 tag 时才发现（release.yml 里另有同名步骤）。
      - name: QML lint
        shell: pwsh
        run: |
          $rinuiRoot = python -c "import RinUI, pathlib; print(pathlib.Path(RinUI.__file__).resolve().parent.parent)"
          $env:QML_IMPORT_PATH = "$(Get-Location).Path;$rinuiRoot"
          $files = Get-ChildItem qml -Recurse -Filter *.qml
          $errors = 0
          foreach ($file in $files) {
            $out = & pyside6-qmllint -I . $file.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "qmllint failed: $($file.FullName)"
              $out | Write-Host
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "qmllint: $($files.Count) files OK"

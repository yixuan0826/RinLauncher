name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许手动重跑，发布出问题时不需再推一个空 commit。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check rin_launcher tests scripts

      - name: Pytest
        shell: pwsh
        run: |
          # 失败摘要走 ::error:: 才能在匿名状态下从 Annotations 看到。
          $ErrorActionPreference = 'Continue'
          $out = & pytest tests -q --tb=line 2>&1
          $code = $LASTEXITCODE
          $out | Out-Host
          if ($code -ne 0) {
            $out | Where-Object { $_ -match '^(FAILED|ERROR)|Error:|assert' } |
              Select-Object -First 8 |
              ForEach-Object { Write-Host "::error::$($_.Trim())" }
            exit $code
          }

      # 逻辑在 scripts/lint_qml.py（runner 的 pwsh 与本地对 qmllint 的 stderr
      # 处理不一致）。无桌面 runner 上偶有环境性失败，这里只作报告；
      # 本地用同一脚本做严格门禁，不阻断发布。
      - name: QML lint
        continue-on-error: true
        run: python scripts/lint_qml.py

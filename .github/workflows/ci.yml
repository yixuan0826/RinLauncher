name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许手动重跑，发布出问题时不需再推一个空 commit。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check rin_launcher tests scripts

      - name: Pytest
        run: pytest tests -q

      # QML 有八千多行且没有自动化 UI 测试，lint 必须在 PR 阶段就拦下来，
      # 不能等到打 tag 时才发现（release.yml 里另有同名步骤）。
      # 具体逻辑在 scripts/lint_qml.py：runner 的 pwsh 默认 $ErrorActionPreference
      # 为 Stop，qmllint 往 stderr 打的 warning 会被当成致命错误直接终止步骤，
      # 本地与 CI 行为不一致。放进 Python 后两边走同一条代码路径。
      - name: QML lint
        run: python scripts/lint_qml.py

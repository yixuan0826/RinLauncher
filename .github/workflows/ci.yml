name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许手动重跑，发布出问题时不需再推一个空 commit。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      # --no-cache：isort 的「第一方 / 第三方」判定看仓库根目录有无同名包。
      # 删掉内联 RinUI/ 后 import RinUI 变成第三方，旧的 .ruff_cache 会把
      # 改前结论当成最新而放行（本地就靠这个隐患提前放过了一次）。
      - name: Ruff
        run: ruff check rin_launcher tests scripts --no-cache

      - name: Pytest
        run: pytest tests -q

      # runner 的 pwsh 默认 $ErrorActionPreference = 'Stop'，qmllint 往 stderr
      # 写的 warning 会被当成致命错误；放进 Python 后本地与 CI 同一条路径。
      - name: QML lint
        run: python scripts/lint_qml.py
